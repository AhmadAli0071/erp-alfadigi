# ============================================================
#  AlfaDigi ERP — Nginx reverse proxy
#  Copy to: /etc/nginx/sites-available/alfadigi
#  Then:  ln -s /etc/nginx/sites-available/alfadigi /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#  Domain badal lena: erp.example.com → apna domain
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;   # <-- APNA DOMAIN YAHAN LIKHO

    # File upload limit
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SSE stream (/api/notifications/stream) — buffering OFF zaroori hai
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # API + App — sab backend (Express client/dist bhi serve karta hai)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
