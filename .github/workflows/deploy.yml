# Auto-deploy: push to main -> this PC pulls, builds, restarts PM2.
# Requires the self-hosted runner "erp-pc" (Windows, running as the same
# user that owns PM2) registered on this repo.
name: Deploy to ERP PC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, erp-pc]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Pull latest code
        working-directory: C:\Users\HM Traders\Desktop\erp-alfadigi
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install + build server
        working-directory: C:\Users\HM Traders\Desktop\erp-alfadigi\server
        run: |
          npm install
          npm run build

      - name: Install + build client
        working-directory: C:\Users\HM Traders\Desktop\erp-alfadigi\client
        run: |
          npm install
          npm run build

      - name: Restart backend (PM2)
        run: |
          pm2 restart alfadigi-erp --update-env
          Start-Sleep -Seconds 8
          Invoke-RestMethod http://127.0.0.1:5000/api/health -TimeoutSec 20 | ConvertTo-Json
